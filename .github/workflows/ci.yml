name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint .
      - run: npx prettier --check .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static site
        id: build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Report build failure
        if: failure() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          echo '::error title=Next.js build failed::See the Build static site step and next-build-log artifact for the complete error. Fonts are bundled in src/app/fonts; no Google Fonts download is required.'
          printf '### Next.js build failed\n\nSee the **Build static site** step and **next-build-log** artifact for full diagnostics. Fonts are bundled in `src/app/fonts`.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve build diagnostics
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: next-build-log
          path: build.log
          retention-days: 7
