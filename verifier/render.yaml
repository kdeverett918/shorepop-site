# Render Blueprint for the Shorepop purchase verifier. Values are set in the dashboard / API,
# never committed (sync: false). See DEPLOY.md for the non-secret values.
# Durable storage (WO-20261013-64): always-on starter compute backed by external PostgreSQL
# (VERIFIER_STORE=postgres + VERIFIER_DATABASE_URL) to avoid both free-plan idle resets and
# Render persistent-disk stop-first deploy outages.
# Health isolation (WO-20261118-396): /healthz checks ONLY process configuration and canonical
# settlement ledger reachability; side jobs and growing-bound warnings report on /status.
services:
  - type: web
    name: shorepop-verifier-michael
    runtime: docker
    plan: starter
    region: oregon
    repo: https://github.com/kdeverett918/shorepop-site
    branch: codex/shorepop-michael-verifier
    rootDir: verifier
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: UGS_PROJECT_ID
        sync: false
      - key: UGS_ADDITIONAL_PROJECT_IDS
        sync: false
      - key: APP_BUNDLE_ID
        sync: false
      - key: GOOGLE_PACKAGE_ID
        sync: false
      - key: APPLE_BUNDLE_ID
        sync: false
      - key: APPLE_ALLOWED_ENVIRONMENTS
        sync: false
      - key: GOOGLE_PLAY_SA_JSON
        sync: false
      - key: APPLE_IAP_KEY_ID
        sync: false
      - key: APPLE_IAP_ISSUER_ID
        sync: false
      - key: APPLE_IAP_PRIVATE_KEY
        sync: false
      - key: VERIFIER_STORE
        sync: false
      - key: VERIFIER_DB_PATH
        sync: false
      - key: VERIFIER_DATABASE_URL
        sync: false
      - key: VERIFIER_REVENUE_PROOF_KEY
        sync: false
      - key: GOOGLE_PLAY_LICENSE_KEY
        sync: false
      - key: VERIFIER_SUBSCRIPTION_REVISION_EPOCH
        sync: false
